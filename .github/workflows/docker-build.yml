name: Build, Scan, and Publish Images

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/docker-build.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: image-publish-main
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            repository_secret: ECR_BACKEND_REPOSITORY
          - name: frontend
            context: frontend
            repository_secret: ECR_FRONTEND_REPOSITORY
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: blog-${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.name == 'frontend' && 'VITE_API_URL=/api' || '' }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: blog-${{ matrix.name }}:${{ github.sha }}
          vuln-type: os,library
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Configure AWS credentials through OIDC or secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-2' }}
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN || '' }}
      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6
      - name: Push immutable and rolling tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets[matrix.repository_secret] }}
          IMAGE: blog-${{ matrix.name }}:${{ github.sha }}
        run: |
          docker tag "$IMAGE" "$REGISTRY/$REPOSITORY:${GITHUB_SHA}"
          docker tag "$IMAGE" "$REGISTRY/$REPOSITORY:main"
          docker tag "$IMAGE" "$REGISTRY/$REPOSITORY:latest"
          docker push "$REGISTRY/$REPOSITORY:${GITHUB_SHA}"
          docker push "$REGISTRY/$REPOSITORY:main"
          docker push "$REGISTRY/$REPOSITORY:latest"
