apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blog-platform.fullname" . }}-backend
spec:
  podSelector:
    matchLabels: { app: {{ include "blog-platform.fullname" . }}-backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: {{ include "blog-platform.fullname" . }}-frontend }
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports: [{ protocol: TCP, port: 8000 }]
