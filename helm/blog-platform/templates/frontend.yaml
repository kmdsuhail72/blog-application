apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blog-platform.fullname" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels: { app: {{ include "blog-platform.fullname" . }}-frontend }
  template:
    metadata:
      labels: { app: {{ include "blog-platform.fullname" . }}-frontend }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports: [{ containerPort: 80 }]
          resources: {{ toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "blog-platform.fullname" . }}-frontend }
spec:
  selector: { app: {{ include "blog-platform.fullname" . }}-frontend }
  ports: [{ port: {{ .Values.frontend.service.port }}, targetPort: 80 }]
