{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "blog-platform.fullname" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "blog-platform.fullname" . }}-tls
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ include "blog-platform.fullname" . }}-backend, port: { number: {{ .Values.backend.service.port }} } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "blog-platform.fullname" . }}-frontend, port: { number: {{ .Values.frontend.service.port }} } } }
{{- end }}
