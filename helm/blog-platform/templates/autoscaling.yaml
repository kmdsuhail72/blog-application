{{- if .Values.backend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "blog-platform.fullname" . }}-backend
spec:
  scaleTargetRef: { apiVersion: {{ ternary "argoproj.io/v1alpha1" "apps/v1" .Values.backend.rollout.enabled }}, kind: {{ ternary "Rollout" "Deployment" .Values.backend.rollout.enabled }}, name: {{ include "blog-platform.fullname" . }}-backend }
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }} } }
{{- end }}
---
{{- if .Values.frontend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "blog-platform.fullname" . }}-frontend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "blog-platform.fullname" . }}-frontend }
  minReplicas: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.frontend.autoscaling.targetCPUUtilizationPercentage }} } }
{{- end }}
