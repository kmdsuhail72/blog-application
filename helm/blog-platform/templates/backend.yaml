apiVersion: {{ ternary "argoproj.io/v1alpha1" "apps/v1" .Values.backend.rollout.enabled }}
kind: {{ ternary "Rollout" "Deployment" .Values.backend.rollout.enabled }}
metadata:
  name: {{ include "blog-platform.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  {{- if .Values.backend.rollout.enabled }}
  strategy:
    canary:
      steps: {{ toYaml .Values.backend.rollout.steps | nindent 8 }}
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels: { app: {{ include "blog-platform.fullname" . }}-backend }
  template:
    metadata:
      labels: { app: {{ include "blog-platform.fullname" . }}-backend }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports: [{ containerPort: 8000 }]
          resources: {{ toYaml .Values.backend.resources | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: DATABASE_URL } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: SECRET_KEY } }
            - { name: APP_NAME, value: "Blog API" }
            - { name: DEBUG, value: "false" }
            - { name: ALGORITHM, value: "HS256" }
            - { name: ACCESS_TOKEN_EXPIRE_MINUTES, value: "30" }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "blog-platform.fullname" . }}-backend }
spec:
  selector: { app: {{ include "blog-platform.fullname" . }}-backend }
  ports: [{ port: {{ .Values.backend.service.port }}, targetPort: 8000 }]
