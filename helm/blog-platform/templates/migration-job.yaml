apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "blog-platform.fullname" . }}-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: DATABASE_URL } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: SECRET_KEY } }
            - { name: APP_NAME, value: "Blog API" }
            - { name: DEBUG, value: "false" }
            - { name: ALGORITHM, value: "HS256" }
            - { name: ACCESS_TOKEN_EXPIRE_MINUTES, value: "30" }
